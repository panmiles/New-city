<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>City Freedom 3D</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#101820;font-family:system-ui;color:white}#hud{position:fixed;top:14px;left:14px;background:#101820b8;padding:12px 16px;border-radius:12px;z-index:3}#hud strong{font-size:20px}#hint{font-size:12px;opacity:.85}#status{margin-top:6px;color:#8af0ce}#actions{position:fixed;right:20px;bottom:28px;z-index:4;display:flex;gap:10px}button{border:0;border-radius:12px;background:#ffb23e;color:#171717;font-weight:800;padding:15px;cursor:pointer}#touch{position:fixed;left:20px;bottom:25px;z-index:4;display:grid;grid-template-columns:repeat(3,52px);gap:5px}#touch button{padding:12px;background:#ffffffaa}#touch .empty{visibility:hidden}#cross{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);opacity:.35;pointer-events:none}#start{position:fixed;inset:0;background:#07111cdd;display:flex;align-items:center;justify-content:center;z-index:10;text-align:center}#start section{padding:28px;max-width:450px}#start h1{font-size:38px;margin:0 0 12px}#start p{line-height:1.7}</style></head><body><div id="hud"><strong>🌆 CITY FREEDOM 3D</strong><div id="hint">WASD เดิน/ขับ · Shift วิ่ง · E ขึ้น/ลงรถ · ลูกศร ← → หมุนกล้อง</div><div id="status">โหมดเดิน</div></div><div id="cross">+</div><div id="touch"><span class="empty"></span><button data-key="KeyW">▲</button><span class="empty"></span><button data-key="KeyA">◀</button><button data-key="KeyS">▼</button><button data-key="KeyD">▶</button></div><div id="actions"><button id="turn">หมุนกล้อง</button><button id="enter">ขึ้น / ลงรถ (E)</button></div><div id="start"><section><h1>🌆 CITY FREEDOM</h1><p>ต้นแบบเกมเมืองเปิดโลก 3D เดินสำรวจเมืองและขับรถได้<br>ใช้คีย์บอร์ดหรือปุ่มบนหน้าจอ</p><button id="play">เริ่มเล่นเกม</button></section></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x91c8ed);scene.fog=new THREE.Fog(0x91c8ed,100,290);const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xe8f4ff,0x4e5b4c,2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(45,90,30);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-120;sun.shadow.camera.right=120;sun.shadow.camera.top=120;sun.shadow.camera.bottom=-120;scene.add(sun);
const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.8});const grass=mat(0x60916a),road=mat(0x343a42),walk=mat(0xa5a7a4),white=mat(0xf3eee0),yellow=mat(0xf7ca56);function block(w,h,d,m,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}block(420,.2,420,grass,0,-.15,0);for(let k=-3;k<=3;k++){const p=k*48;block(420,.08,13,road,0,.02,p);block(13,.08,420,road,p,.03,0);for(let i=-200;i<200;i+=13){block(5,.015,.25,yellow,i,.07,p);block(.25,.015,5,yellow,p,.08,i)}}let seed=15;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}const colors=[0xc2c9d2,0xe3b28d,0x91a9bc,0xd6d1be,0xb4bbc6];for(let gx=-3;gx<3;gx++)for(let gz=-3;gz<3;gz++){let x=gx*48+24,z=gz*48+24;let h=10+rand()*42;block(25,h,25,mat(colors[Math.floor(rand()*colors.length)]),x,h/2,z);for(let y=4;y<h-1;y+=5)for(let q=-2;q<=2;q++){block(2.2,2,.13,mat(0x425e72),x+q*4.4,y,z-12.6);block(.13,2,2.2,mat(0x425e72),x-12.6,y,z+q*4.4)}}
const player=new THREE.Group();const torso=new THREE.Mesh(new THREE.BoxGeometry(.9,1.35,.5),mat(0x214b9c));torso.position.y=1.65;player.add(torso);const head=new THREE.Mesh(new THREE.SphereGeometry(.38,12,12),mat(0xf0c7a2));head.position.y=2.55;player.add(head);for(let x of [-.25,.25]){const leg=new THREE.Mesh(new THREE.BoxGeometry(.3,.85,.35),mat(0x222d3b));leg.position.set(x,.55,0);player.add(leg)}scene.add(player);player.position.set(0,0,0);
const car=new THREE.Group();const chassis=new THREE.Mesh(new THREE.BoxGeometry(2.6,.75,4.7),mat(0xe95537));chassis.position.y=.85;car.add(chassis);const roof=new THREE.Mesh(new THREE.BoxGeometry(2.1,.8,2.4),mat(0x263e53));roof.position.set(0,1.55,-.25);car.add(roof);for(let x of [-1.35,1.35])for(let z of [-1.5,1.5]){let wheel=new THREE.Mesh(new THREE.CylinderGeometry(.48,.48,.28,16),mat(0x1b1b1b));wheel.rotation.z=Math.PI/2;wheel.position.set(x,.48,z);car.add(wheel)}car.position.set(6,0,0);scene.add(car);let driving=false,angle=0,camAngle=0,speed=0;const keys=new Set();const status=document.querySelector('#status');function enter(){if(driving){driving=false;player.position.copy(car.position).add(new THREE.Vector3(3,0,0));player.visible=true;speed=0}else if(player.position.distanceTo(car.position)<7){driving=true;player.visible=false;angle=car.rotation.y}else{status.textContent='เดินเข้าใกล้รถก่อน (ภายใน 7 เมตร)';return}status.textContent=driving?'🚗 กำลังขับรถ':'🚶 โหมดเดิน'}document.querySelector('#enter').onclick=enter;document.querySelector('#turn').onclick=()=>camAngle+=Math.PI/4;document.querySelector('#play').onclick=()=>document.querySelector('#start').remove();addEventListener('keydown',e=>{keys.add(e.code);if(e.code==='KeyE'&&!e.repeat)enter();if(e.code==='ArrowLeft')camAngle-=.18;if(e.code==='ArrowRight')camAngle+=.18});addEventListener('keyup',e=>keys.delete(e.code));document.querySelectorAll('[data-key]').forEach(b=>{const code=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys.add(code);b.setPointerCapture(e.pointerId)});b.addEventListener('pointerup',()=>keys.delete(code));b.addEventListener('pointercancel',()=>keys.delete(code))});let last=performance.now();function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.05);last=now;const f=Number(keys.has('KeyW'))-Number(keys.has('KeyS')),s=Number(keys.has('KeyD'))-Number(keys.has('KeyA'));if(driving){speed=THREE.MathUtils.lerp(speed,f*(keys.has('ShiftLeft')?23:15),Math.min(1,dt*2));if(!f)speed*=Math.max(0,1-dt*2);angle-=s*dt*1.6*(speed>=0?1:-1)*Math.min(1,Math.abs(speed)/4);car.rotation.y=angle;car.position.x-=Math.sin(angle)*speed*dt;car.position.z-=Math.cos(angle)*speed*dt}else if(f||s){const dir=new THREE.Vector3(s,0,-f).normalize().applyAxisAngle(new THREE.Vector3(0,1,0),camAngle);player.position.addScaledVector(dir,dt*(keys.has('ShiftLeft')?10:5));player.rotation.y=Math.atan2(-dir.x,-dir.z)}const target=driving?car.position:player.position;const a=driving?angle:camAngle;const offset=new THREE.Vector3(Math.sin(a)*10,driving?6:5,Math.cos(a)*10);camera.position.lerp(target.clone().add(offset),Math.min(1,dt*5));camera.lookAt(target.x,driving?1.2:1.6,target.z);renderer.render(scene,camera)}requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
